<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="content">
        <div class="head">
            <h2>CRUDS</h2>
            <p>PROTECT MANAGEMENT SYSTEMS </p>
        </div>
        <div class="container">
            <div class="input">
                <div class="detail">
                    <input type="text" name="title" id="title" placeholder="Title">
                    <div class="cost">
                        <input onkeyup="getTotal()" type="text" id="price" placeholder="Price">
                        <input onkeyup="getTotal()" type="number" id="ads" placeholder="Ads">
                        <input onkeyup="getTotal()" type="number" id="taxses" placeholder="Taxses">
                        <input onkeyup="getTotal()" type="number" id="desc" placeholder="Desc">
                        <button onkeyup="getTotal()" class="btn" id="total" >Total</button>
                    </div>
                    <input type="number" id="count" placeholder="Count">
                    <input type="text" id="category" placeholder="Category">
                    <button class="btn1" id="create">Creat</button>
                    <input type="text"onkeyup=searchItem(this.value) id="search" placeholder="Search">


                </div>

            </div>
            <div class="output">
                <div class="Sway">
                    <button class="btn2" onclick="getsearchmoode(this.id)" id="titleSearch"> Search By Title</button>
                    <button class="btn2" onclick="getsearchmoode(this.id)" id="categorySearch">Search By Category</button>
                </div>
                <button class="btn1" id="del" onclick="deleteAll()"> Delete All</button>
                <div class="info">
                    <table>
                        <tr>
                            <th>ID</th>
                            <th>TITLE</th>
                            <th>PRICE</th>
                            <th>TIPS</th>
                            <th>ADS</th>
                            <th>DISCOUNT</th>
                            <th>TOTAL</th>
                            <th>Category</th>
                            <th>UPDATE</th>
                            <th>DELETE</th>
                            
                        </tr>
                        <tbody id="tbody">
                            

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    
</body>
</html>
